[project]
name = "pybox-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=13.0.0",
    "alembic>=1.14.0",
    "alembic-postgresql-enum>=1.0.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "cryptography>=45.0.0",
    "fastapi>=0.136.1",
    "fastexcel>=0.20.2",
    "google-auth[requests]>=2.40.0",
    "httpx>=0.28.0",
    "mercadopago>=3.3.0",
    "polars>=1.40.1",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.49",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx-ws>=0.9.0",
    "isort>=9.0.2",
    "pip-audit>=2.9.0",
    "pylint>=4.0.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
