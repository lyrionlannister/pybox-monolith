# Producción. Los certificados los emite y renueva certbot en el host (webroot
# /var/www/certbot); el compose monta /etc/letsencrypt y /var/www/certbot en solo lectura.
# Se monta /etc/letsencrypt completo (no solo live/): live/<dominio>/*.pem son symlinks a
# ../../archive/, que quedarían rotos dentro del contenedor.

# X-Forwarded-For se SOBRESCRIBE con $remote_addr (no se usa
# $proxy_add_x_forwarded_for): la API corre uvicorn con --forwarded-allow-ips=*, que
# toma la IP más a la izquierda del header, así que conservar la que manda el cliente
# le permitiría falsear su IP y evadir el rate limit de login/OTP. Este nginx es el
# primer salto; si se pone un CDN/balanceador delante, configurar real_ip aquí.

# HTTP: solo sirve el desafío ACME de certbot y redirige todo lo demás a HTTPS.
server {
    listen 80;
    server_name pybox.co www.pybox.co dev.pybox.co app.pybox.co api.pybox.co db-manager.pybox.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Landing
server {
    listen 443 ssl;
    http2 on;
    server_name pybox.co www.pybox.co;

    ssl_certificate     /etc/letsencrypt/live/pybox.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pybox.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# App (client). Hoy se sirve en dev.pybox.co; app.pybox.co aún no tiene DNS ni
# certificado. Cuando exista el DNS, ampliar el certificado dev.pybox.co con
# `-d app.pybox.co` (ver README) y no hace falta tocar este bloque.
server {
    listen 443 ssl;
    http2 on;
    server_name dev.pybox.co app.pybox.co;

    ssl_certificate     /etc/letsencrypt/live/dev.pybox.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.pybox.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.pybox.co;

    ssl_certificate     /etc/letsencrypt/live/api.pybox.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pybox.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    location = /api/v1/chats/ws {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1800s;
    }

    location = /api/v1/whatsapp/chats/ws {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1800s;
    }

    location = /api/v1/notifications/stream {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# pgAdmin
server {
    listen 443 ssl;
    http2 on;
    server_name db-manager.pybox.co;

    ssl_certificate     /etc/letsencrypt/live/db-manager.pybox.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db-manager.pybox.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /;
    }
}
