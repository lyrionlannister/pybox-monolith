name: Seguridad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codigo-inyectado:
    name: Detectar código inyectado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar archivos versionados
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.woff|*.woff2)
                magic=$(head -c4 "$f")
                if [ "$magic" != "wOFF" ] && [ "$magic" != "wOF2" ]; then
                  echo "::error file=$f::no es una fuente real"; bad=1
                fi
                continue ;;
              *.min.js) continue ;;
            esac
            # Los iconos SVG en .tsx tienen líneas largas legítimas; la inyección va en archivos de configuración.
            case "$f" in
              *.config.*|*eslintrc*|.vscode/*)
                if ! awk 'length > 2000 { exit 1 }' "$f"; then
                  echo "::error file=$f::línea de más de 2000 caracteres"; bad=1
                fi ;;
            esac
            if grep -qE 'global\.i *=|drpc\.org|publicnode\.com|blastapi\.io|1rpc\.io' "$f"; then
              echo "::error file=$f::contiene un marcador de malware conocido"; bad=1
            fi
          done < <(git ls-files -z -- '*.js' '*.cjs' '*.mjs' '*.ts' '*.tsx' '*.jsx' '*.woff' '*.woff2' '.vscode/*')
          if [ -f .vscode/tasks.json ] && grep -q folderOpen .vscode/tasks.json; then
            echo "::error file=.vscode/tasks.json::tarea que se ejecuta al abrir la carpeta"; bad=1
          fi
          exit $bad

  dependencias-api:
    name: Vulnerabilidades conocidas en dependencias (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - name: pip-audit sobre uv.lock
        run: |
          uv export --no-dev --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  dependencias-client:
    name: Vulnerabilidades conocidas en dependencias (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Misma versión que ci.yml / client/Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit (solo dependencias de producción, severidad alta o mayor)
        run: pnpm audit --prod --audit-level high

  sast-api:
    name: Análisis estático de seguridad (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      # Severidad y confianza altas: sin ruido de hallazgos de bajo impacto. Las
      # excepciones justificadas se marcan en el código con `# nosec <regla>`.
      - name: bandit
        run: uvx --python 3.14 bandit -r src -q -lll -iii

  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Los falsos positivos revisados están en .gitleaksignore (por fingerprint).
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact
